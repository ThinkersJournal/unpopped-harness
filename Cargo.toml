[package]
name = "unpopped-harness"
version = "0.0.17"
edition = "2021"
rust-version = "1.85"
description = "External test and profile harnesses for Unpopped emitters: exhaustive cross-backend kernel comparison, per-op timing."
license = "MIT OR Apache-2.0"
repository = "https://github.com/ThinkersJournal/unpopped-harness"

# Depends on the PUBLISHED crates only (CireSnave's sources rule, 2026-10-07):
# no path or git deps into the Unpopped or Baracuda trees.
[dependencies]
unpopped = "0.45.12"
unpopped-cpu-c = "0.45.12"
unpopped-vocab = "0.45.12"
baracuda-cuda-emit = { version = "0.45.0", features = ["nvrtc"] }
baracuda-driver = "0.1.0-alpha.139"
baracuda-nvrtc = "0.1.0-alpha.139"
libloading = "0.9"
vulkane = "0.21.1"
fishstringer-slang-emit = "0.1.0"
sha2 = "0.11.0"
serde_json = "1.0.154"
